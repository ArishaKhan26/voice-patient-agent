<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Registration Dashboard</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1a1a1e;
    --muted: #6b6b73;
    --accent: #2f6fed;
    --accent-soft: #eaf0fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { padding: 24px 32px; max-width: 1100px; margin: 0 auto; }
  .filters {
    display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .filters input {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    min-width: 160px;
  }
  .filters button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  .filters button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: none; }
  #empty, #loading { color: var(--muted); padding: 24px; text-align: center; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border-radius: 10px;
    width: min(560px, 92vw);
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal h2 { margin-top: 0; }
  .modal .close {
    float: right;
    cursor: pointer;
    color: var(--muted);
    font-size: 20px;
  }
  .field-grid {
    display: grid;
    grid-template-columns: 140px 1fr;
    row-gap: 6px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .field-grid dt { color: var(--muted); }
  .field-grid dd { margin: 0; }
  .calls h3 { font-size: 14px; margin-bottom: 8px; }
  .call-entry {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .call-entry .meta { color: var(--muted); margin-bottom: 4px; }
  .no-calls { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Patient Registration Dashboard</h1>
  <p>Patients registered by the voice agent (and the REST API), live from the database.</p>
</header>
<main>
  <div class="filters">
    <input id="f-last-name" placeholder="Last name" />
    <input id="f-phone" placeholder="Phone number" />
    <input id="f-dob" placeholder="DOB (YYYY-MM-DD)" />
    <button id="apply">Filter</button>
    <button class="secondary" id="clear">Clear</button>
  </div>
  <div id="loading">Loading patients…</div>
  <div id="empty" style="display:none">No patients found.</div>
  <table id="table" style="display:none">
    <thead>
      <tr>
        <th>Name</th>
        <th>DOB</th>
        <th>Phone</th>
        <th>City / State</th>
        <th>Insurance</th>
        <th>Registered</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <span class="close" id="close-modal">&times;</span>
    <h2 id="modal-name"></h2>
    <dl class="field-grid" id="modal-fields"></dl>
    <div class="calls">
      <h3>Call history</h3>
      <div id="modal-calls"></div>
    </div>
  </div>
</div>

<script>
const rowsEl = document.getElementById('rows');
const tableEl = document.getElementById('table');
const loadingEl = document.getElementById('loading');
const emptyEl = document.getElementById('empty');

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}
function fmtPhone(p) {
  if (!p || p.length !== 10) return p || '—';
  return `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`;
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

async function loadPatients() {
  loadingEl.style.display = 'block';
  tableEl.style.display = 'none';
  emptyEl.style.display = 'none';

  const params = new URLSearchParams();
  const lastName = document.getElementById('f-last-name').value.trim();
  const phone = document.getElementById('f-phone').value.replace(/\D/g, '');
  const dob = document.getElementById('f-dob').value.trim();
  if (lastName) params.set('last_name', lastName);
  if (phone) params.set('phone_number', phone);
  if (dob) params.set('date_of_birth', dob);

  const resp = await fetch('/patients?' + params.toString());
  const body = await resp.json();
  const patients = body.data || [];

  loadingEl.style.display = 'none';
  if (patients.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  tableEl.style.display = 'table';
  rowsEl.innerHTML = patients.map(p => `
    <tr data-id="${p.patient_id}">
      <td>${esc(p.first_name)} ${esc(p.last_name)}</td>
      <td>${esc(p.date_of_birth)}</td>
      <td>${esc(fmtPhone(p.phone_number))}</td>
      <td>${esc(p.city)}, ${esc(p.state)}</td>
      <td>${p.insurance_provider ? esc(p.insurance_provider) : '<span class="badge">none</span>'}</td>
      <td>${fmtDate(p.created_at)}</td>
    </tr>
  `).join('');

  rowsEl.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => openModal(tr.dataset.id, patients.find(p => p.patient_id === tr.dataset.id)));
  });
}

async function openModal(id, patient) {
  document.getElementById('modal-name').textContent = `${patient.first_name} ${patient.last_name}`;
  const fields = document.getElementById('modal-fields');
  const rows = [
    ['Phone', fmtPhone(patient.phone_number)],
    ['Email', patient.email || '—'],
    ['DOB', patient.date_of_birth],
    ['Sex', patient.sex],
    ['Address', `${patient.address_line_1}${patient.address_line_2 ? ', ' + patient.address_line_2 : ''}`],
    ['City/State/ZIP', `${patient.city}, ${patient.state} ${patient.zip_code}`],
    ['Insurance', patient.insurance_provider ? `${patient.insurance_provider} (${patient.insurance_member_id || 'no ID'})` : '—'],
    ['Language', patient.preferred_language],
    ['Emergency contact', patient.emergency_contact_name ? `${patient.emergency_contact_name} — ${fmtPhone(patient.emergency_contact_phone)}` : '—'],
    ['Registered', fmtDate(patient.created_at)],
  ];
  fields.innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');

  const callsEl = document.getElementById('modal-calls');
  callsEl.innerHTML = 'Loading…';
  const resp = await fetch(`/patients/${id}/calls`);
  const body = await resp.json();
  const calls = body.data || [];
  if (calls.length === 0) {
    callsEl.innerHTML = '<div class="no-calls">No calls linked to this patient yet.</div>';
  } else {
    callsEl.innerHTML = calls.map(c => `
      <div class="call-entry">
        <div class="meta">${fmtDate(c.created_at)} · ended: ${esc(c.ended_reason || 'unknown')}</div>
        <div>${esc(c.summary || c.transcript || 'No transcript available.')}</div>
      </div>
    `).join('');
  }

  document.getElementById('overlay').classList.add('open');
}

document.getElementById('close-modal').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') document.getElementById('overlay').classList.remove('open');
});
document.getElementById('apply').addEventListener('click', loadPatients);
document.getElementById('clear').addEventListener('click', () => {
  document.getElementById('f-last-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-dob').value = '';
  loadPatients();
});

loadPatients();
</script>
</body>
</html>
